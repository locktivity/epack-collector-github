name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@cf4107a5798b6b442e821e7ddcff50ceaa82e8a0 # v0.10.0
    with:
      name: github
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: GITHUB_TOKEN GITHUB_APP_PRIVATE_KEY
      checks: |
        ./scripts/check-forbidden-data.sh
