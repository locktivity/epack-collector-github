name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@7abb6fd52582dd5f8c79d0a302b6e24b1604fc64 # v0.10.0 plus test-timeout, without the lint cache
    with:
      name: github
      # The simulated organizations' runs take the race suite past Go's
      # default of 10 minutes.
      test-timeout: 30m
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: GITHUB_TOKEN GITHUB_APP_PRIVATE_KEY
      checks: |
        ./scripts/check-forbidden-data.sh
